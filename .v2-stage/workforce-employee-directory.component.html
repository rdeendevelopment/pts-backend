<aside class="wr-dir" [class.open]="open" aria-label="Employee directory">
 <header><div><h2>Team Members</h2><span>{{users.length}} employees</span></div><button (click)="openChange.emit(false)" aria-label="Close employee directory"><i class="ri-close-line"></i></button></header>
 <div class="controls"><label><i class="ri-search-line"></i><input [(ngModel)]="search" placeholder="Search name or email" aria-label="Search employees"></label><select [(ngModel)]="filter" aria-label="Employee status"><option value="all">All</option><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
 <div class="list"><div class="skeleton" *ngIf="loading"></div><button class="employee lightweight" *ngFor="let u of filtered;trackBy:track" [class.selected]="u.id===selectedId" (click)="choose(u.id)" [attr.aria-current]="u.id===selectedId?'page':null"><span class="avatar">{{u.initials}}</span><span class="person"><strong>{{u.name}}</strong><small>{{u.role||u.email}}</small></span><span class="active-dot" [class.inactive]="!u.isActive" [attr.aria-label]="u.isActive?'Active employee':'Inactive employee'"></span></button><div class="empty" *ngIf="!loading&&!filtered.length"><i class="ri-user-search-line"></i><strong>No employees found</strong><span>Try another search or filter.</span></div></div>
</aside><button class="backdrop" *ngIf="open" (click)="openChange.emit(false)" aria-label="Close employee directory"></button>
