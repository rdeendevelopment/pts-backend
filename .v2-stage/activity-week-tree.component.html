<div class="awt" *ngIf="projects.length;else empty">
 <section class="awt-project" *ngFor="let project of projects;trackBy:track"><button type="button" class="awt-project-row" (click)="toggleProject(project.key)" [attr.aria-expanded]="projectExpansion.has(project.key)"><i class="ri-arrow-right-s-line chevron" [class.open]="projectExpansion.has(project.key)"></i><i class="ri-folder-3-line folder"></i><span>{{project.name}}</span><small>{{project.entryCount}} entries</small><strong>{{duration(project.totalMinutes)}}</strong></button>
  <div class="awt-tasks" *ngIf="projectExpansion.has(project.key)"><section class="awt-task" *ngFor="let task of project.tasks;trackBy:track"><button type="button" class="awt-task-row" (click)="toggleTask(task.key)" [attr.aria-expanded]="taskExpansion.has(task.key)"><i class="ri-arrow-right-s-line chevron" [class.open]="taskExpansion.has(task.key)"></i><span>{{task.label}}</span><small>{{task.entries.length}} entries</small><strong>{{duration(task.totalMinutes)}}</strong></button>
   <div class="awt-entries" *ngIf="taskExpansion.has(task.key)"><div class="awt-entry" *ngFor="let entry of task.entries;trackBy:trackEntry"><span class="entry-date">{{date(entry.entry_date)}}</span><span class="entry-category">{{category(entry)}}</span><span class="entry-description">{{entry.description||'No description'}}</span><span class="entry-source">{{entry.entry_type==='clock'?'Timer':'Manual'}}</span><strong>{{duration(entry.duration_minutes)}}</strong><div class="entry-actions" *ngIf="!readonly"><button *ngIf="entry.entry_type!=='add-activity'" (click)="editEntry.emit(entry)" aria-label="Edit time entry"><i class="ri-pencil-line"></i></button><button *ngIf="entry.entry_type!=='add-activity'" (click)="deleteEntry.emit(entry)" aria-label="Delete time entry"><i class="ri-delete-bin-6-line"></i></button><button class="edit-week" *ngIf="entry.entry_type==='add-activity'" (click)="editWeek.emit()">Edit week</button></div></div></div>
  </section></div>
 </section>
</div><ng-template #empty><div class="awt-empty"><i class="ri-time-line"></i><div><strong>No entries this week</strong><span>No activity was recorded for this report.</span></div></div></ng-template>
